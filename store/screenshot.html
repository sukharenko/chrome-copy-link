<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg1: #eef3fd; --bg2: #f8f9fb; --ink: #1f1f1f; --muted: #5f6368;
    --win: #ffffff; --strip: #dfe3eb; --tab: #ffffff; --omni: #f1f3f4; --line: #e3e6ea;
    --chip: #ffffff; --chip-ink: #1f1f1f; --accent: #1a73e8; --ok: #1e8e3e;
  }
  .dark {
    --bg1: #16213a; --bg2: #121316; --ink: #e8eaed; --muted: #9aa0a6;
    --win: #35363a; --strip: #202124; --tab: #35363a; --omni: #202124; --line: #45474b;
    --chip: #2a2b2f; --chip-ink: #e8eaed; --accent: #8ab4f8; --ok: #34a853;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: radial-gradient(1200px 700px at 85% -10%, var(--bg1), var(--bg2));
    color: var(--ink); position: relative;
  }
  h1 { position: absolute; left: 96px; top: 92px; font-size: 64px; font-weight: 700; letter-spacing: -1.5px; }
  h1 span { color: var(--accent); }
  .sub { position: absolute; left: 98px; top: 180px; font-size: 24px; color: var(--muted); }

  .win {
    position: absolute; left: 96px; top: 272px; width: 1088px; height: 330px;
    background: var(--win); border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.18), 0 0 0 1px var(--line);
  }
  .strip { height: 46px; background: var(--strip); display: flex; align-items: flex-end; padding: 0 12px; gap: 8px; }
  .dots { display: flex; gap: 8px; align-self: center; margin-right: 14px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .tab { background: var(--tab); height: 36px; width: 240px; border-radius: 10px 10px 0 0;
         display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; }
  .fav { width: 16px; height: 16px; border-radius: 4px; background: #f29900; }
  .bar { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .nav { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); opacity: .6; }
  .omni { flex: 1; height: 38px; border-radius: 19px; background: var(--omni);
          display: flex; align-items: center; padding: 0 18px; font-size: 16px; color: var(--ink); }
  .omni b { font-weight: 400; color: var(--muted); }
  .ext { position: relative; width: 40px; height: 40px; border-radius: 50%;
         display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent);
         outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); }
  .ext img { width: 20px; height: 20px; }
  .badge { position: absolute; right: -10px; top: -8px; background: var(--ok); color: #fff;
           font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 8px; }
  .cursor { position: absolute; left: 20px; top: 22px; width: 26px; }
  .page { padding: 34px 40px; }
  .page i { display: block; height: 14px; border-radius: 7px; background: var(--line); margin-bottom: 16px; }

  .chip {
    position: absolute; right: 96px; top: 560px; display: flex; align-items: center; gap: 14px;
    background: var(--chip); color: var(--chip-ink); padding: 16px 22px; border-radius: 14px;
    font-size: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.22), 0 0 0 1px var(--line);
  }
  .chip .ok { width: 28px; height: 28px; border-radius: 50%; background: var(--ok); color: #fff;
              display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .chip small { display: block; color: var(--muted); font-size: 13px; margin-bottom: 2px; }

  .pills { position: absolute; left: 96px; top: 690px; display: flex; gap: 12px; }
  .pills span { padding: 10px 18px; border-radius: 22px; font-size: 17px; color: var(--muted);
                box-shadow: inset 0 0 0 1px var(--line); background: color-mix(in srgb, var(--win) 60%, transparent); }
</style>
</head>
<body>
  <h1>One click. <span>Link copied.</span></h1>
  <p class="sub">Copies the current tab's URL to your clipboard. Nothing else.</p>

  <div class="win">
    <div class="strip">
      <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
      <div class="tab"><div class="fav"></div>How to write a good README</div>
    </div>
    <div class="bar">
      <div class="nav"></div><div class="nav"></div><div class="nav"></div>
      <div class="omni">blog.example.com<b>/posts/how-to-write-a-good-readme</b></div>
      <div class="ext">
        <img id="icon" src="../src/icons/light-32.png">
        <span class="badge">✓</span>
        <svg class="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-7 1 4 8-3 1-4-8-5 5z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="page">
      <i style="width:46%;height:26px;margin-bottom:26px"></i>
      <i style="width:92%"></i><i style="width:86%"></i><i style="width:90%"></i><i style="width:60%"></i>
    </div>
  </div>

  <div class="chip">
    <div class="ok">✓</div>
    <div><small>Clipboard</small>https://blog.example.com/posts/how-to-write-a-good-readme</div>
  </div>

  <div class="pills">
    <span>No tracking</span><span>No page access</span><span>Works on every tab</span><span>Light &amp; dark icon</span>
  </div>

  <script>
    if (location.hash === '#dark') {
      document.documentElement.classList.add('dark');
      document.getElementById('icon').src = '../src/icons/dark-32.png';
    }
  </script>
</body>
</html>
